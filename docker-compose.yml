services:
  backend:
    build:
      context: ./backend
    image: home-finance-planner/backend:local
    # Host port 5001 (override with BACKEND_PORT); the container always
    # listens on 8080 internally.
    ports:
      - "${BACKEND_PORT:-5001}:8080"
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_PATH: /data/finance.db
      # Uploaded receipt images and store logos live on the persisted volume.
      BILLS_PATH: /data/bills
      STORES_PATH: /data/stores
      CORS_ALLOWED_ORIGINS: ""
      # Required in production — generate with: openssl rand -base64 32
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?set AI_ENCRYPTION_KEY in .env (openssl rand -base64 32)}
      # Generous ceiling for AI bill extraction (local vision models are slow).
      LLM_TIMEOUT: ${LLM_TIMEOUT:-5m}
    volumes:
      - sqlite-data:/data
    # Lets the container reach services on the host (e.g. a local Ollama at
    # http://host.docker.internal:11434) — required on Linux, harmless on Mac.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: home-finance-planner/frontend:local
    # UI on host port 5002 (override with UI_PORT); nginx inside listens on 80
    # and proxies /api to the backend container.
    ports:
      - "${UI_PORT:-5002}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite-data: