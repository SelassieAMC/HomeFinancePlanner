server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Receipt uploads: one receipt can arrive as up to 8 parts of 10 MB each
    # (backend caps per-file size and part count).
    client_max_body_size 100m;

    # SPA fallback: let the React router own all non-API paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # River job-queue web UI (served as /riverui by the backend itself, not
    # part of the SPA) — longest prefix wins over the fallback below.
    location /riverui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Proxy API calls to the backend service (see docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets are content-hashed by Vite.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}