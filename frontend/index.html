<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Self-hosted home finance planner — accounts, budgets, transactions and AI receipt scanning."
    />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Home Finance Planner</title>
    <script>
      /* Resolve the theme before first paint (no flash): stored choice or
         the OS preference, applied as data-theme + color-scheme on <html>. */
      (function () {
        var raw = null;
        try { raw = localStorage.getItem('hfp.theme'); } catch (e) {}
        var dark =
          raw === 'dark' ||
          (raw !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var el = document.documentElement;
        el.dataset.theme = dark ? 'dark' : 'light';
        el.style.colorScheme = dark ? 'dark' : 'light';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? '#12161d' : '#f5f6f8';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
